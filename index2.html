<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth - GitHub Pages</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .auth-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 4px; transition: 0.3s; margin-bottom: 5px; }
        #btnLogin { background-color: #4CAF50; color: white; }
        #btnSignUp { background-color: #2196F3; color: white; }
        #btnLogout { background-color: #f44336; color: white; margin-top: 20px; }
        #message { margin-top: 15px; font-size: 14px; text-align: center; color: #555; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-card">
    <div id="auth-form">
        <h2>Üyelik Sistemi</h2>
        <input type="email" id="email" placeholder="E-posta Adresi">
        <input type="password" id="password" placeholder="Şifre">
        <button id="btnLogin">Giriş Yap</button>
        <button id="btnSignUp">Kayıt Ol</button>
    </div>

    <div id="user-info" class="hidden">
        <h3>Hoş Geldin!</h3>
        <p id="user-email"></p>
        <button id="btnLogout">Çıkış Yap</button>
    </div>

    <div id="message"></div>
</div>

<script type="module">
    // Firebase Modüllerini CDN üzerinden içe aktarıyoruz
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // BURAYI KENDİ BİLGİLERİNLE DOLDUR
    const firebaseConfig = {
        apiKey: "AIzaSyBI5AA7Y2Io3K_lx15oL7viw8M1RoXLftc",
  authDomain: "ornekweb-f007c.firebaseapp.com",
  projectId: "ornekweb-f007c",
  storageBucket: "ornekweb-f007c.firebasestorage.app",
  messagingSenderId: "797710830614",
  appId: "1:797710830614:web:813ee61412df64c87cb937",
  measurementId: "G-N46JXTXXBZ"
    };

    // Firebase'i Başlat
    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    // DOM Elementleri
    const emailInp = document.getElementById('email');
    const passInp = document.getElementById('password');
    const btnSignUp = document.getElementById('btnSignUp');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const messageDiv = document.getElementById('message');
    const authForm = document.getElementById('auth-form');
    const userInfo = document.getElementById('user-info');
    const userEmailText = document.getElementById('user-email');

    // Kayıt Ol
    btnSignUp.onclick = async () => {
        try {
            await createUserWithEmailAndPassword(auth, emailInp.value, passInp.value);
            messageDiv.innerText = "Kullanıcı oluşturuldu!";
        } catch (error) {
            messageDiv.innerText = "Hata: " + error.message;
        }
    };

    // Giriş Yap
    btnLogin.onclick = async () => {
        try {
            await signInWithEmailAndPassword(auth, emailInp.value, passInp.value);
            messageDiv.innerText = "Giriş başarılı!";
        } catch (error) {
            messageDiv.innerText = "Hata: " + error.message;
        }
    };

    // Çıkış Yap
    btnLogout.onclick = async () => {
        await signOut(auth);
        messageDiv.innerText = "Çıkış yapıldı.";
    };

    // Oturum Durumunu Dinle (Kullanıcı giriş yaptı mı?)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authForm.classList.add('hidden');
            userInfo.classList.remove('hidden');
            userEmailText.innerText = user.email;
        } else {
            authForm.classList.remove('hidden');
            userInfo.classList.add('hidden');
            userEmailText.innerText = "";
        }
    });
</script>

</body>
</html>
